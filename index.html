<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="GEMFALL — a match-3 gem game. Endless, timed and moves modes with cascades and power gems." />
  <meta name="theme-color" content="#000000" />
  <!-- Installable app: home-screen icon, full screen, offline (public/manifest.webmanifest). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <title>GEMFALL — match-3</title>
  <style>
    :root {
      /* AMOLED palette: true black is a switched-off pixel, and every text colour reaches at
         least 4.5:1 on black and on the darkest cards (checked by the playtest). */
      --ink: #000;
      --text-hi: #f4f1ff;
      --text: #ddd6ff;
      --text-dim: #a99fd8;
      --text-faint: #8d84c0;
      --line: rgba(255, 255, 255, 0.14);
      --bg-1: #1a0f42;
      --bg-2: #0b0718;
      --accent: #a5b4fc;
      --accent-2: #f0abfc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: #e8e6ff;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      /* True black behind the game, with one faint glow at the top: on an AMOLED panel black
         pixels are off, and a violet wash over the whole page reads as muddy. */
      background: radial-gradient(90% 45% at 50% -8%, rgba(80, 30, 170, 0.35) 0%, transparent 70%), var(--ink);
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* Soft animated aurora so the canvas feels embedded in a world, not a box. */
    body::before {
      content: "";
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 70%;
      background: radial-gradient(50% 50% at 50% 50%, rgba(129, 140, 248, 0.08), transparent 70%);
      filter: blur(30px);
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes drift {
      from { transform: translate3d(-6%, -4%, 0) scale(1); }
      to   { transform: translate3d(6%, 4%, 0) scale(1.1); }
    }

    /*
     * The canvas must never size its own container.
     *
     * Phaser's FIT scale is computed from the parent element's box. If the parent is
     * sized by its content, the 720x900 canvas inflates it to 720x900, Phaser reads
     * parentSize=720x900, concludes scale 1.0, and the board never shrinks — which is
     * exactly what happened on phones. Pinning the container to the viewport instead
     * means the canvas can be larger than its parent, and FIT can do its job.
     *
     * 100dvh rather than 100% because the layout viewport extends behind mobile
     * browser chrome.
     *
     * The safe-area insets keep the game clear of a notch or gesture bar. They go on the
     * box itself, not as padding: Phaser measures the parent's box and ignores its padding.
     * src/layout.ts reads this box at boot to pick the game's height.
     */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      overflow: hidden;
    }

    #game canvas {
      display: block;
      border-radius: 20px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      touch-action: none;
    }

    /*
     * The front screen: the splash, then the menu, on one page (src/ui/front.ts drives it).
     * The look follows the Figma splash design: lettered-gem logo over falling gems, mode cards,
     * difficulty chips and a PLAY NOW button. Pure CSS plus a tiny inline script, so the splash
     * paints before the game bundle loads. Fonts are bundled (see src/main.ts); no network.
     *
     *   .splash   logo and falling gems only (first 1.5 s)
     *   .menu     the menu controls have faded in under the logo
     *   .hidden   a game is on; the Phaser canvas underneath shows through
     */
    #front {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--ink);
      color: var(--text);
      font-family: Nunito, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 400ms ease;
    }
    #front.hidden { opacity: 0; pointer-events: none; }
    #front.gone { display: none; }

    #front .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      /* One soft glow behind the logo; everything else stays true black (a big haze reads as
         muddy grey-violet on an AMOLED panel). */
      background: radial-gradient(ellipse 70% 38% at 50% 30%, rgba(70, 20, 160, 0.32) 0%, transparent 70%);
    }

    #front .fall { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    #front .fall i {
      position: absolute;
      display: block;
      animation: gem-fall linear infinite;
    }

    .gem {
      display: block;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.32) 0%, var(--top) 22%, var(--base) 62%, rgba(0, 0, 0, 0.22) 100%);
    }
    .gem.diamond  { clip-path: polygon(50% 0%, 100% 36%, 76% 100%, 24% 100%, 0% 36%); }
    .gem.hex      { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    .gem.shield   { clip-path: polygon(10% 0%, 90% 0%, 100% 57%, 50% 100%, 0% 57%); }
    .gem.kite     { clip-path: polygon(50% 0%, 100% 38%, 80% 100%, 20% 100%, 0% 38%); }
    .gem.octagon  { clip-path: polygon(29% 0%, 71% 0%, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0% 71%, 0% 29%); }
    .gem.marquise { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }

    #front main {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      min-height: 100%;
      width: 100%;
      max-width: 32rem;
      margin: 0 auto;
      padding: calc(40px + env(safe-area-inset-top, 0px)) 24px calc(40px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }

    /* The logo-wrap carries the glide from the splash position; the logo inside floats. */
    #front .logo-wrap { will-change: transform; }
    #front .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: float-y 3.6s ease-in-out infinite;
      cursor: default;
    }
    #front .logo.tap { animation: logo-tap 90ms ease-out; }

    #front .gems { display: flex; align-items: flex-end; gap: clamp(4px, 1.4vw, 10px); }
    #front .gems span {
      display: block;
      filter: drop-shadow(0 0 7px var(--glow));
      animation: gem-pulse 2.6s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.22s);
    }
    #front .gems .gem { width: 28px; height: 28px; }

    #front h1 {
      margin: 0;
      display: flex;
      align-items: baseline;
      gap: 0.01em;
      font-family: "Cinzel Decorative", Georgia, serif;
      font-size: clamp(2.6rem, 8.8vw, 5.4rem);
      font-weight: 700;
      line-height: 1;
    }
    #front h1 span {
      display: inline-block;
      color: var(--c);
      /* A tight glow keeps the letters crisp at ~409 ppi; a wide one smears into haze. */
      text-shadow: 0 0 10px color-mix(in srgb, var(--c) 45%, transparent);
    }

    #front .titles { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; }
    #front .sub {
      margin: 0;
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(0.8rem, 2.6vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #c9b8ff;
    }
    #front .tag {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    /* The private voice's tagline (see docs/DEVELOPING.md). */
    #front .tag.moopit { color: #a5b4fc; }

    /* Menu controls: absent on the splash, then fade up one after another. */
    #front .ui { display: contents; }
    #front.splash .ui > * { display: none; }
    #front .ui > * { animation: ui-in 520ms ease both; animation-delay: calc(var(--n, 0) * 70ms + 120ms); }
    #front.settled .ui > * { animation: none; }

    #front .divider {
      width: 16rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(140, 80, 255, 0.45), transparent);
    }

    #front button {
      position: relative;
      margin: 0;
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #front button:focus-visible { box-shadow: 0 0 0 2px rgba(210, 175, 255, 0.7); }
    /* Small chips keep the design's size but get a finger-sized tap area around them. */
    #front .chip::before { content: ""; position: absolute; inset: -12px -4px; }

    /* Three cards share one row at any phone width; the descriptions wrap inside them. */
    #front .modes { display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 26rem; }
    #front .mode {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      border-radius: 12px;
      background: #0c0a16;
      border: 1px solid var(--line);
      transition: all 200ms ease;
    }
    #front .mode[aria-pressed="true"] {
      background: color-mix(in srgb, var(--c) 9.4%, transparent);
      border-color: color-mix(in srgb, var(--c) 33%, transparent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--c) 16.5%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    #front .mode .icon { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c) 27%, transparent)); }
    #front .mode[aria-pressed="true"] .icon { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 67%, transparent)); }
    #front .mode .gem { width: 22px; height: 22px; }
    #front .mode .label {
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    /* Text takes a lighter tint of the mode colour: pure saturated blue on black glows but
       doesn't read. */
    #front .mode[aria-pressed="true"] .label { color: var(--l); }
    #front .mode .desc { font-size: 0.75rem; line-height: 1.25; color: var(--text-faint); }

    #front .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    #front .chip {
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      color: var(--text-dim);
      transition: all 150ms ease;
    }
    #front .chip[aria-pressed="true"] {
      background: rgba(140, 60, 255, 0.3);
      border-color: rgba(170, 110, 255, 0.7);
      color: var(--text-hi);
    }

    #front .play {
      overflow: hidden;
      padding: 15px 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8822ff 0%, #4422ee 50%, #1155ee 100%);
      border: 1px solid rgba(185, 135, 255, 0.22);
      animation: ui-in 520ms ease both, cta-glow 2.8s ease-in-out infinite;
      animation-delay: calc(var(--n, 0) * 70ms + 120ms), 0s;
    }
    #front.settled .play { animation: cta-glow 2.8s ease-in-out infinite; }
    #front .play::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 200ms ease;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
    }
    #front .play:hover::after, #front .play:active::after { opacity: 1; }
    #front .play span {
      position: relative;
      font-family: Cinzel, Georgia, serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
    }

    /* Extras the design doesn't show, kept quiet in its style. */
    #front .resume {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 34px;
      border-radius: 14px;
      border: 1px solid rgba(185, 135, 255, 0.3);
      background: rgba(140, 60, 255, 0.08);
    }
    #front .resume b {
      font-family: Cinzel, Georgia, serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #e2d4ff;
    }
    #front .resume small { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--text-dim); }
    #front .best {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    #front .foot {
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-faint);
    }

    /* Corner buttons on the menu and in a game (src/ui/corners.ts): the speaker top left (a red
       slash when muted), the gear (settings) top right. Hidden until the splash is over. */
    #corners[hidden] { display: none; }
    #corners .corner {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      z-index: 20;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #6366f1;
      background: #0b0918;
      color: var(--text-hi);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: ui-in 520ms ease both;
    }
    #corners .corner:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
    #corners .corner:active { background: #1c1638; }
    #corners .speaker { left: calc(14px + env(safe-area-inset-left, 0px)); }
    #corners .gear { right: calc(14px + env(safe-area-inset-right, 0px)); }
    #corners svg { width: 26px; height: 26px; }
    #corners .speaker .slash { display: none; }
    #corners .speaker.muted .slash { display: inline; }
    #corners .speaker.muted .waves { opacity: 0.35; }

    /* Settings panel: a sheet over everything, on the menu and in a game. */
    #settings {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      font-family: Nunito, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #settings[hidden] { display: none; }
    #settings .sheet {
      box-sizing: border-box;
      width: 100%;
      max-width: 28rem;
      max-height: 100%;
      overflow-y: auto;
      padding: 22px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      border-radius: 22px 22px 0 0;
      background: #0a0814;
      border: 1px solid var(--line);
      border-bottom: 0;
      color: var(--text);
      animation: sheet-in 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (min-height: 600px) and (min-width: 600px) {
      #settings { align-items: center; }
      #settings .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); }
    }
    #settings h2 {
      margin: 0 0 8px;
      font-family: Cinzel, Georgia, serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-hi);
      text-align: center;
    }
    #settings .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #settings .what { display: flex; flex-direction: column; gap: 2px; }
    #settings .name { font-size: 1rem; font-weight: 800; color: var(--text-hi); }
    #settings .hint { font-size: 0.8rem; color: var(--text-dim); }
    #settings button {
      margin: 0;
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #settings button:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
    #settings .switch {
      position: relative;
      flex: none;
      width: 56px;
      height: 32px;
      border-radius: 999px;
      background: #2a2640;
      transition: background 150ms ease;
    }
    #settings .switch i {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: transform 150ms ease, background 150ms ease;
    }
    #settings .switch[aria-pressed="true"] { background: #7c3aed; }
    #settings .switch[aria-pressed="true"] i { transform: translateX(24px); background: #fff; }
    #settings .hold, #settings .step {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      background: #14111f;
    }
    #settings .hold:active { background: #7c3aed; color: #fff; }
    #settings .row.stack { flex-wrap: wrap; }
    #settings .steps { display: flex; gap: 6px; flex: none; }
    #settings .row.stack .steps { flex: 1 1 100%; }
    #settings .row.stack .step { flex: 1; }
    #settings .step { padding: 0 10px; min-width: 48px; }
    #settings .step[aria-pressed="true"] { background: rgba(140, 60, 255, 0.35); border-color: rgba(170, 110, 255, 0.8); color: #fff; }
    #settings .status { min-height: 1.2em; margin: 6px 0 0; font-size: 0.8rem; color: var(--text-dim); }
    #settings .done {
      display: block;
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8822ff 0%, #4422ee 50%, #1155ee 100%) !important;
      font-family: Cinzel, Georgia, serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #fff;
    }
    @keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Hidden unless loading runs past the splash's 1.5 s (the inline script adds .slow). */
    #front .loading {
      display: none;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transition: opacity 400ms ease;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a5a2d8;
    }
    #front.splash .loading { display: flex; }
    #front.splash.slow .loading { opacity: 1; }

    #front .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgb(129, 140, 248);
      opacity: 0;
    }
    #front .flash.on { animation: flash 220ms ease-out; }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(165, 180, 252, 0.22);
      border-top-color: var(--accent);
      border-right-color: var(--accent-2);
      animation: spin 900ms linear infinite;
    }

    @keyframes gem-fall {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(115vh) rotate(200deg); }
    }
    @keyframes gem-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    @keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes cta-glow {
      0%, 100% { box-shadow: 0 0 18px rgba(110, 20, 255, 0.45); }
      50%      { box-shadow: 0 0 30px rgba(110, 20, 255, 0.7); }
    }
    @keyframes ui-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes logo-tap { from { transform: scale(0.94); } to { transform: scale(1); } }
    @keyframes flash { from { opacity: 0.45; } to { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* A phone on its side: logo on the left, the controls stacked on the right, so PLAY NOW
       is on screen without scrolling. */
    @media (orientation: landscape) and (max-height: 540px) {
      #front main {
        max-width: none;
        flex-direction: row;
        justify-content: center;
        gap: clamp(24px, 6vw, 72px);
        padding: 16px calc(24px + env(safe-area-inset-right, 0px)) 16px calc(24px + env(safe-area-inset-left, 0px));
      }
      #front.menu .ui { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      #front .ui .divider { display: none; }
      #front.menu h1 { font-size: clamp(2.2rem, 7vh, 3.2rem); }
      #front .mode { padding: 10px 16px; gap: 5px; }
      #front .buzz-status { margin-top: -8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      .spinner { animation-duration: 2.4s; }
      #front .fall i, #front .gems span, #front .logo, #front .play, #front .ui > * { animation: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Splash, then menu: see #front in the styles above and src/ui/front.ts. -->
  <div id="front" class="splash">
    <div class="glow" aria-hidden="true"></div>
    <div class="fall" id="front-fall" aria-hidden="true"></div>
    <div class="flash" aria-hidden="true"></div>
    <main>
      <div class="logo-wrap">
        <div class="logo" id="front-logo">
          <div class="gems" aria-hidden="true">
            <span style="--i:0;--glow:#22ee6699"><i class="gem shield"   style="--top:#44ee77;--base:#11bb44"></i></span>
            <span style="--i:1;--glow:#ff336699"><i class="gem diamond"  style="--top:#ff6688;--base:#ee0033"></i></span>
            <span style="--i:2;--glow:#3377ff99"><i class="gem hex"      style="--top:#5599ff;--base:#1155ff"></i></span>
            <span style="--i:3;--glow:#ffbb1199"><i class="gem octagon"  style="--top:#ffcc44;--base:#ffaa00"></i></span>
            <span style="--i:4;--glow:#bb44ff99"><i class="gem kite"     style="--top:#cc77ff;--base:#9911ff"></i></span>
            <span style="--i:5;--glow:#11ddff99"><i class="gem marquise" style="--top:#55eeff;--base:#00ccff"></i></span>
            <span style="--i:6;--glow:#ff551199"><i class="gem diamond"  style="--top:#ff8866;--base:#ff4400"></i></span>
          </div>
          <h1 aria-label="Gemfall">
            <span style="--c:#22ee66">G</span><span style="--c:#ff3366">E</span><span style="--c:#3377ff">M</span><span style="--c:#ffbb11">F</span><span style="--c:#bb44ff">A</span><span style="--c:#11ddff">L</span><span style="--c:#ff5511">L</span>
          </h1>
          <div class="titles">
            <p class="sub">of the Moopit</p>
            <p class="tag" id="front-tag">Match · Chain · Explode</p>
          </div>
        </div>
      </div>

      <div class="loading"><div class="spinner"></div><span>Loading gems…</span></div>

      <!-- Filled in by src/ui/front.ts once the game has loaded. -->
      <div class="ui" id="front-ui"></div>
    </main>
  </div>

  <script>
    // Still loading once the splash's 1.5 s are up: show the quiet "Loading gems…" line.
    setTimeout(function () {
      var front = document.getElementById('front');
      if (front && front.classList.contains('splash')) front.classList.add('slow');
    }, 1500);

    // Falling gems behind the splash and menu. Inline, so they paint before the bundle loads.
    (function () {
      var host = document.getElementById('front-fall');
      if (!host) return;
      var kinds = [
        ['shield', '#44ee77', '#11bb44', '#00aa3355'], ['diamond', '#ff6688', '#ee0033', '#ff003355'],
        ['hex', '#5599ff', '#1155ff', '#0044ff55'], ['kite', '#cc77ff', '#9911ff', '#8800ee55'],
        ['octagon', '#ffcc44', '#ffaa00', '#ff880055'], ['marquise', '#55eeff', '#00ccff', '#00aacc55'],
        ['diamond', '#ff8866', '#ff4400', '#dd330055']
      ];
      for (var n = 0; n < 28; n++) {
        var k = kinds[n % kinds.length];
        var size = 15 + Math.random() * 28;
        var wrap = document.createElement('i');
        wrap.style.left = ((n * 3.6 + Math.random() * 3.5) % 101) + '%';
        wrap.style.top = -(size + 24) + 'px';
        // Crisp, no blurred glow: on an AMOLED panel a field of soft glows reads as haze.
        wrap.style.opacity = String(0.14 + Math.random() * 0.2);
        wrap.style.animationDuration = (7 + Math.random() * 10) + 's';
        wrap.style.animationDelay = '-' + (Math.random() * 17) + 's';
        var gem = document.createElement('b');
        gem.className = 'gem ' + k[0];
        gem.style.cssText = 'width:' + size + 'px;height:' + size + 'px;--top:' + k[1] + ';--base:' + k[2];
        wrap.appendChild(gem);
        host.appendChild(wrap);
      }
    })();
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
